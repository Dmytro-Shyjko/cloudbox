# CloudBox upload proxy tuning
# Include this from the server{} block that proxies to databoxpro-flask.service (127.0.0.1:5000).

# Global request size cap. Keep aligned with UPLOAD_MAX_MB in /etc/cloudbox/cloudbox.env.
client_max_body_size 1024m;

# Default upstream timeouts.
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Upload API tuning.
location ^~ /api/uploads/ {
	proxy_pass http://127.0.0.1:5000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# Slow uplinks and large chunk bodies.
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;
	proxy_request_buffering off;

	# Optional: avoid aggressive rate limits on init/status/chunk endpoints.
	# If limit_req is used globally, add a dedicated zone with relaxed limits here.
}
